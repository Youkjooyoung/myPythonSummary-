<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code 플러그인 생명주기 · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist','Noto Sans KR',system-ui,sans-serif; --font-serif:'Instrument Serif','Noto Serif KR',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .scroll { overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:1040px; display:block; }
    svg text { font-family:'Geist','Noto Sans KR','Malgun Gothic',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · Lifecycle phase map</p>
    <h1>Claude Code 플러그인 생명주기</h1>

    <div class="scroll">
    <svg viewBox="0 0 1040 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plugin-lifecycle-title plugin-lifecycle-desc">
      <title id="plugin-lifecycle-title">Claude Code 플러그인 생명주기</title>
      <desc id="plugin-lifecycle-desc">플러그인이 미등록에서 마켓플레이스 등록, 설치를 거쳐 활성 상태가 되고, 활성 상태에서 비활성·업데이트를 오가다가 제거로 끝나는 생명주기.</desc>
      <defs>
        <pattern id="plugin-lifecycle-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="plugin-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="plugin-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#plugin-lifecycle-dots)" opacity="0.55"/>
      <rect x="24" y="44" width="992" height="120" rx="8" fill="rgba(79,93,117,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <rect x="24" y="400" width="992" height="104" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <text x="40" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PAUSE / UPDATE</text>
      <text x="40" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
      <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">TERMINAL OUTCOME</text>

      <!-- Eight labeled transitions, drawn before states. -->
      <line x1="204" y1="256" x2="268" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#plugin-lifecycle-arrow)"/>
      <line x1="408" y1="256" x2="472" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#plugin-lifecycle-arrow)"/>
      <line x1="612" y1="256" x2="676" y2="256" stroke="#bf4520" stroke-width="1.4" marker-end="url(#plugin-lifecycle-arrow-accent)"/>
      <line x1="722" y1="220" x2="722" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#plugin-lifecycle-arrow)"/>
      <line x1="770" y1="140" x2="770" y2="220" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#plugin-lifecycle-arrow)"/>
      <path d="M816 244 H894 Q902 244 902 236 V140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#plugin-lifecycle-arrow)"/>
      <path d="M950 140 V260 Q950 268 942 268 H816" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#plugin-lifecycle-arrow)"/>
      <line x1="746" y1="292" x2="746" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#plugin-lifecycle-arrow)"/>

      <!-- Opaque masks keep every transition label clear of its stroke. -->
      <g font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
        <rect x="220" y="238" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="236" y="247">ADD</text>
        <rect x="418" y="238" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="440" y="247">INSTALL</text>
        <rect x="624" y="238" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="644" y="247" fill="#bf4520">RELOAD</text>
        <rect x="670" y="174" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="692" y="183">DISABLE</text>
        <rect x="778" y="174" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="798" y="183">ENABLE</text>
        <rect x="836" y="226" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="856" y="235">UPDATE</text>
        <rect x="860" y="276" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="880" y="285">RELOAD</text>
        <rect x="682" y="348" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="710" y="357">UNINSTALL</text>
      </g>

      <!-- Primary rail: four phases. -->
      <g text-anchor="middle">
        <g><rect x="64" y="220" width="140" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="134" y="251" fill="#2d3142" font-size="13" font-weight="600">미등록</text><text x="134" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">unknown source</text></g>
        <g><rect x="268" y="220" width="140" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="338" y="251" fill="#2d3142" font-size="13" font-weight="600">마켓플레이스 등록</text><text x="338" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">marketplace add</text></g>
        <g><rect x="472" y="220" width="140" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="542" y="251" fill="#2d3142" font-size="13" font-weight="600">설치</text><text x="542" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">user · project · local</text></g>
        <g><rect x="676" y="220" width="140" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><text x="746" y="251" fill="#2d3142" font-size="13" font-weight="600">활성</text><text x="746" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">skills·hooks·agents·MCP</text></g>
      </g>

      <!-- Supporting states. -->
      <g text-anchor="middle">
        <g><rect x="676" y="68" width="140" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/><rect x="686" y="78" width="40" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="706" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">PAUSED</text><text x="746" y="111" fill="#2d3142" font-size="13" font-weight="600">비활성</text><text x="746" y="126" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">/plugin disable</text></g>
        <g><rect x="856" y="68" width="140" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/><rect x="866" y="78" width="44" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="888" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">REFRESH</text><text x="926" y="111" fill="#2d3142" font-size="13" font-weight="600">업데이트</text><text x="926" y="126" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">/plugin update</text></g>
      </g>

      <!-- Terminal outcome. -->
      <g text-anchor="middle">
        <g><rect x="676" y="416" width="140" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75"/><rect x="686" y="426" width="54" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="713" y="435" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">TERMINAL</text><text x="746" y="459" fill="#2d3142" font-size="13" font-weight="600">제거</text><text x="746" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">/plugin uninstall</text></g>
      </g>
    </svg>
    </div>
  </div>
</body>
</html>
