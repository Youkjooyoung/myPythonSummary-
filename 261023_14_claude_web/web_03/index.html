<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생활 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>생활 계산기</h1>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="다크 모드로 전환">🌙</button>
    </header>

    <!-- 탭: data-tab 값과 아래 section의 data-panel 값이 짝 -->
    <nav class="tabs" role="tablist" aria-label="계산기 종류">
      <button class="tab" type="button" role="tab" data-tab="basic">계산기</button>
      <button class="tab" type="button" role="tab" data-tab="discount">할인</button>
      <button class="tab" type="button" role="tab" data-tab="dutch">더치페이</button>
      <button class="tab" type="button" role="tab" data-tab="saving">예적금</button>
      <button class="tab" type="button" role="tab" data-tab="unit">단위 변환</button>
      <button class="tab" type="button" role="tab" data-tab="date">날짜</button>
      <button class="tab" type="button" role="tab" data-tab="age">나이</button>
    </nav>

    <!-- 1. 기본 계산기 -->
    <section class="panel" data-panel="basic" role="tabpanel" aria-label="기본 계산기">
      <!-- 화면: 위쪽은 계산식, 아래쪽은 현재 입력값 -->
      <div class="display">
        <div class="expression" id="expression"></div>
        <div class="current" id="current">0</div>
      </div>

      <!-- 버튼: data-key 값으로 어떤 키인지 구분 -->
      <div class="keys">
        <button class="key func" type="button" data-key="clear">AC</button>
        <button class="key func" type="button" data-key="backspace">⌫</button>
        <button class="key func" type="button" data-key="percent">%</button>
        <button class="key op" type="button" data-key="/">÷</button>

        <button class="key" type="button" data-key="7">7</button>
        <button class="key" type="button" data-key="8">8</button>
        <button class="key" type="button" data-key="9">9</button>
        <button class="key op" type="button" data-key="*">×</button>

        <button class="key" type="button" data-key="4">4</button>
        <button class="key" type="button" data-key="5">5</button>
        <button class="key" type="button" data-key="6">6</button>
        <button class="key op" type="button" data-key="-">−</button>

        <button class="key" type="button" data-key="1">1</button>
        <button class="key" type="button" data-key="2">2</button>
        <button class="key" type="button" data-key="3">3</button>
        <button class="key op" type="button" data-key="+">+</button>

        <button class="key func" type="button" data-key="sign">±</button>
        <button class="key" type="button" data-key="0">0</button>
        <button class="key" type="button" data-key=".">.</button>
        <button class="key equals" type="button" data-key="=">=</button>
      </div>
    </section>

    <!-- 2. 할인 -->
    <section class="panel" data-panel="discount" role="tabpanel" aria-label="할인 계산" hidden>
      <h2>할인 계산</h2>
      <p class="desc">정가와 할인율로 할인가를 구합니다. 추가 할인은 할인된 가격에 한 번 더 적용됩니다.</p>

      <label class="field">
        <span class="label">정가</span>
        <span class="input-wrap">
          <input type="text" id="discount-price" inputmode="numeric" placeholder="50,000" data-money>
          <span class="suffix">원</span>
        </span>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="label">할인율</span>
          <span class="input-wrap">
            <input type="number" id="discount-rate1" inputmode="decimal" step="any" placeholder="20">
            <span class="suffix">%</span>
          </span>
        </label>
        <label class="field">
          <span class="label">추가 할인 (선택)</span>
          <span class="input-wrap">
            <input type="number" id="discount-rate2" inputmode="decimal" step="any" placeholder="0">
            <span class="suffix">%</span>
          </span>
        </label>
      </div>

      <div class="result" id="discount-result" aria-live="polite"></div>
    </section>

    <!-- 3. 더치페이·팁 -->
    <section class="panel" data-panel="dutch" role="tabpanel" aria-label="더치페이 계산" hidden>
      <h2>더치페이 · 팁</h2>
      <p class="desc">총액을 인원수로 나눕니다. 1인당 금액은 고른 단위로 올림합니다.</p>

      <label class="field">
        <span class="label">총액</span>
        <span class="input-wrap">
          <input type="text" id="dutch-total" inputmode="numeric" placeholder="50,000" data-money>
          <span class="suffix">원</span>
        </span>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="label">인원</span>
          <span class="input-wrap">
            <input type="number" id="dutch-people" inputmode="numeric" min="1" step="1" value="2">
            <span class="suffix">명</span>
          </span>
        </label>
        <label class="field">
          <span class="label">팁</span>
          <span class="input-wrap">
            <input type="number" id="dutch-tip" inputmode="decimal" min="0" step="any" value="0">
            <span class="suffix">%</span>
          </span>
        </label>
      </div>
      <label class="field">
        <span class="label">올림 단위</span>
        <select id="dutch-unit">
          <option value="1">1원 단위</option>
          <option value="10">10원 단위</option>
          <option value="100" selected>100원 단위</option>
          <option value="1000">1,000원 단위</option>
        </select>
      </label>

      <div class="result" id="dutch-result" aria-live="polite"></div>
    </section>

    <!-- 4. 예적금 이자 -->
    <section class="panel" data-panel="saving" role="tabpanel" aria-label="예적금 이자 계산" hidden>
      <h2>예적금 이자</h2>
      <p class="desc">만기에 받는 금액을 구합니다. 이자와 세금은 원 단위 미만을 버립니다.</p>

      <div class="segmented" role="radiogroup" aria-label="상품 종류">
        <label><input type="radio" name="saving-type" value="deposit" checked><span>예금 (목돈)</span></label>
        <label><input type="radio" name="saving-type" value="installment"><span>적금 (매달)</span></label>
      </div>

      <label class="field">
        <span class="label" id="saving-amount-label">예치 금액</span>
        <span class="input-wrap">
          <input type="text" id="saving-amount" inputmode="numeric" placeholder="10,000,000" data-money>
          <span class="suffix">원</span>
        </span>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="label">연이율</span>
          <span class="input-wrap">
            <input type="number" id="saving-rate" inputmode="decimal" min="0" step="any" placeholder="3">
            <span class="suffix">%</span>
          </span>
        </label>
        <label class="field">
          <span class="label">기간</span>
          <span class="input-wrap">
            <input type="number" id="saving-months" inputmode="numeric" min="1" step="1" value="12">
            <span class="suffix">개월</span>
          </span>
        </label>
      </div>

      <div class="segmented" role="radiogroup" aria-label="이자 방식">
        <label><input type="radio" name="saving-method" value="simple" checked><span>단리</span></label>
        <label><input type="radio" name="saving-method" value="compound"><span>월복리</span></label>
      </div>

      <!-- 세율은 천분율(‰)로 둔다: 154 = 15.4%. 소수 곱셈 오차 없이 정수로 계산하기 위해 -->
      <label class="field">
        <span class="label">과세</span>
        <select id="saving-tax">
          <option value="154" selected>일반과세 (15.4%)</option>
          <option value="95">세금우대 (9.5%)</option>
          <option value="0">비과세 (0%)</option>
        </select>
      </label>

      <div class="result" id="saving-result" aria-live="polite"></div>
    </section>

    <!-- 5. 단위 변환 -->
    <section class="panel" data-panel="unit" role="tabpanel" aria-label="단위 변환" hidden>
      <h2>단위 변환</h2>
      <p class="desc">분류를 고르고 값을 입력하면 바로 바꿔 줍니다.</p>

      <div class="field-row">
        <label class="field">
          <span class="label">분류</span>
          <select id="unit-category">
            <option value="length">길이</option>
            <option value="weight">무게</option>
            <option value="temperature">온도</option>
            <option value="area">넓이</option>
          </select>
        </label>
        <label class="field">
          <span class="label">값</span>
          <input type="number" id="unit-value" inputmode="decimal" step="any" value="1">
        </label>
      </div>

      <div class="unit-pair">
        <label class="field">
          <span class="label">변환 전</span>
          <select id="unit-from"></select>
        </label>
        <button class="swap" id="unit-swap" type="button" aria-label="단위 서로 바꾸기">⇄</button>
        <label class="field">
          <span class="label">변환 후</span>
          <select id="unit-to"></select>
        </label>
      </div>

      <div class="result" id="unit-result" aria-live="polite"></div>
    </section>

    <!-- 6. 날짜 -->
    <section class="panel" data-panel="date" role="tabpanel" aria-label="날짜 계산" hidden>
      <h2>날짜 계산</h2>
      <p class="desc">D-day, 두 날짜 사이의 일수, N일 후의 날짜를 구합니다.</p>

      <div class="segmented" role="radiogroup" aria-label="계산 종류">
        <label><input type="radio" name="date-mode" value="dday" checked><span>D-day</span></label>
        <label><input type="radio" name="date-mode" value="between"><span>사이 일수</span></label>
        <label><input type="radio" name="date-mode" value="add"><span>N일 후</span></label>
      </div>

      <!-- data-date-mode 값이 선택한 계산 종류와 같은 묶음만 보인다 -->
      <div data-date-mode="dday">
        <label class="field">
          <span class="label">목표일</span>
          <input type="date" id="date-target">
        </label>
      </div>

      <div class="field-row" data-date-mode="between" hidden>
        <label class="field">
          <span class="label">시작일</span>
          <input type="date" id="date-start">
        </label>
        <label class="field">
          <span class="label">종료일</span>
          <input type="date" id="date-end">
        </label>
      </div>

      <div data-date-mode="add" hidden>
        <label class="field">
          <span class="label">기준일</span>
          <input type="date" id="date-base">
        </label>
        <div class="field-row">
          <label class="field">
            <span class="label">일수</span>
            <span class="input-wrap">
              <input type="number" id="date-days" inputmode="numeric" min="0" step="1" value="100">
              <span class="suffix">일</span>
            </span>
          </label>
          <label class="field">
            <span class="label">방향</span>
            <select id="date-direction">
              <option value="after" selected>후</option>
              <option value="before">전</option>
            </select>
          </label>
        </div>
      </div>

      <label class="check" id="date-include-wrap" hidden>
        <input type="checkbox" id="date-include">
        시작일을 1일로 세기 (기념일·복무일수)
      </label>

      <div class="result" id="date-result" aria-live="polite"></div>
    </section>

    <!-- 7. 나이 -->
    <section class="panel" data-panel="age" role="tabpanel" aria-label="나이 계산" hidden>
      <h2>나이 계산</h2>
      <p class="desc">만 나이는 생일이 지나야 한 살 늘고, 연 나이는 올해 연도에서 태어난 연도를 뺍니다.</p>

      <div class="field-row">
        <label class="field">
          <span class="label">생년월일</span>
          <input type="date" id="age-birth">
        </label>
        <label class="field">
          <span class="label">기준일</span>
          <input type="date" id="age-base">
        </label>
      </div>

      <div class="result" id="age-result" aria-live="polite"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
