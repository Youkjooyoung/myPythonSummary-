<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="machine">
    <!-- 종이 테이프: 계산할 때마다 한 줄씩 찍히는 기록 -->
    <section class="tape" aria-label="계산 기록">
      <div class="tape-head">
        <h1 class="tape-title">계산 기록</h1>
        <button class="tape-clear" id="tape-clear" type="button">테이프 비우기</button>
      </div>
      <div class="tape-roll" id="tape-roll">
        <p class="tape-empty" id="tape-empty">계산하면 여기에 한 줄씩 찍힙니다.</p>
        <ol class="tape-list" id="tape-list"></ol>
      </div>
    </section>

    <!-- 계산기 본체 -->
    <div class="body">
      <div class="body-top">
        <span class="slot" aria-hidden="true"></span>
        <button class="theme-switch" id="theme-switch" type="button" role="switch" aria-checked="false" aria-label="어둡게 보기">
          <span class="switch-label">밝게</span>
          <span class="switch-track"><span class="switch-knob"></span></span>
          <span class="switch-label">어둡게</span>
        </button>
      </div>

      <div class="screen">
        <div class="expr" id="expr"></div>
        <output class="result" id="result" aria-live="polite">0</output>
      </div>

      <div class="keys">
        <button class="key fn" type="button" data-action="clear">AC</button>
        <button class="key fn" type="button" data-action="sign">±</button>
        <button class="key fn" type="button" data-action="percent">%</button>
        <button class="key op" type="button" data-op="÷">÷</button>

        <button class="key" type="button" data-digit="7">7</button>
        <button class="key" type="button" data-digit="8">8</button>
        <button class="key" type="button" data-digit="9">9</button>
        <button class="key op" type="button" data-op="×">×</button>

        <button class="key" type="button" data-digit="4">4</button>
        <button class="key" type="button" data-digit="5">5</button>
        <button class="key" type="button" data-digit="6">6</button>
        <button class="key op" type="button" data-op="−">−</button>

        <button class="key" type="button" data-digit="1">1</button>
        <button class="key" type="button" data-digit="2">2</button>
        <button class="key" type="button" data-digit="3">3</button>
        <button class="key op" type="button" data-op="+">+</button>

        <button class="key zero" type="button" data-digit="0">0</button>
        <button class="key" type="button" data-action="dot">.</button>
        <button class="key equals" type="button" data-action="equals">=</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
